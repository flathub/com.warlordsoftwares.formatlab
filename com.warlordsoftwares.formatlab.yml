app-id: com.warlordsoftwares.formatlab
runtime: org.kde.Platform
runtime-version: "5.15-25.08"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "5.15-25.08"

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

command: formatlab.sh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*
  - --env=QT_ENABLE_HIGHDPI_SCALING=1
  - --env=APP_PLATFORM=FLATPAK

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  - name: luajit
    no-autogen: true
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        disable-shallow-clone: true
        commit: 659a61693aa3b87661864ad0f12eee14c865cd7f
      - type: shell
        commands:
          - sed -i 's|/usr/local|/app|' ./Makefile

  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
        sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dshaderc=disabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: xvidcore
    subdir: build/generic
    build-options:
      cflags: -std=c17
    sources:
      - type: archive
        url: https://downloads.xvid.com/downloads/xvidcore-1.3.7.tar.gz
        sha256: abbdcbd39555691dd1c9b4d08f0a031376a3b211652c0d8b3b8aa9be1303ce2d
        x-checker-data:
          type: anitya
          project-id: 14474
          url-template: https://downloads.xvid.com/downloads/xvidcore-$version.tar.gz

  - name: zimg
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/sekrit-twc/zimg/archive/release-3.0.6.tar.gz
        sha256: be89390f13a5c9b2388ce0f44a5e89364a20c1c57ce46d382b1fcc3967057577

  - name: mpv
    buildsystem: meson
    build-options:
      cflags: -DNDEBUG=1
    config-opts:
      - -Dlibmpv=false
      - -Dbuild-date=false
      - -Dpulse=enabled
      - -Dalsa=enabled
      - -Dmanpage-build=disabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Ddvdnav=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dlua=enabled
      - -Dshaderc=disabled
      - -Dvulkan=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - python3-req.json

  - name: formatlab
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/formatlab
      - cp -r * ${FLATPAK_DEST}/formatlab
      - install -Dm755 ${FLATPAK_DEST}/formatlab/flatpak/formatlab.sh ${FLATPAK_DEST}/bin/formatlab.sh
      - install -Dm644 ${FLATPAK_DEST}/formatlab/flatpak/share/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.warlordsoftwares.formatlab.png
      - install -Dm644 ${FLATPAK_DEST}/formatlab/flatpak/share/applications/formatlab.desktop ${FLATPAK_DEST}/share/applications/com.warlordsoftwares.formatlab.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/com.warlordsoftwares.formatlab.desktop
      - install -Dm644 ${FLATPAK_DEST}/formatlab/flatpak/share/metainfo/com.warlordsoftwares.formatlab.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.warlordsoftwares.formatlab.metainfo.xml
    sources:
      - type: archive
        url: https://warlordsoftwares.com/static/app_builds/flatpak/FLATPAK_FORMAT_LAB.tar.gz
        sha256: 3d3387ca92b8d45a731560dd6e4ad71fe8ee24b8a667eda4bb5dcff2b9d93af7



